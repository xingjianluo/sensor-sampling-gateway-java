# ===== 传感器采样网关本地演示配置 =====
# 规则版本：相同输入 + 相同规则版本，裁决结论可复现
gateway.rules-version=rules-v1

# 有界缓冲与背压
gateway.buffer-capacity=8
gateway.overflow-policy=DROP_OLDEST
gateway.consumer-threads=3

# 瞬时故障：有界重试 + 指数退避
gateway.retry-max-attempts=3
gateway.retry-initial-backoff-ms=5
gateway.retry-multiplier=2.0
gateway.retry-max-backoff-ms=100
gateway.retry-jitter-ratio=0.0

# 持续故障隔离：连续失败阈值与冷却
gateway.breaker-threshold=3
gateway.breaker-cooldown-ms=2000

# 关闭排空超时与裁决记录容量
gateway.shutdown-drain-timeout-ms=5000
gateway.verdict-log-capacity=2048

# 采样对账台账的保留与容量边界（只影响明细保留，不影响采样/裁决本身）
# 每代（每次 start/restart 为一代）保留的对账明细条数上限
gateway.reconcile-detail-capacity=4096
# 封代（已优雅停止的历史批次）最多保留几代；超出后确定性清除最旧的已封代
gateway.reconcile-max-sealed-generations=8
# 明细超容量后的行为：ROLL_OLDEST（顶掉最旧）或 IGNORE_NEW（只更新聚合计数，明细一条不改）
gateway.reconcile-retention-policy=ROLL_OLDEST

# ----- 模拟传感器（无真实硬件） -----
gateway.sensors[0].id=temp-1
gateway.sensors[0].type=TEMPERATURE
gateway.sensors[0].period-ms=200
gateway.sensors[0].range-min=-40
gateway.sensors[0].range-max=80
gateway.sensors[0].timestamp-tolerance-ms=1000
gateway.sensors[0].calibration-gain=1.0
gateway.sensors[0].calibration-offset=0.0

gateway.sensors[1].id=hum-1
gateway.sensors[1].type=HUMIDITY
gateway.sensors[1].period-ms=250
gateway.sensors[1].range-min=0
gateway.sensors[1].range-max=100
gateway.sensors[1].timestamp-tolerance-ms=1000
gateway.sensors[1].calibration-gain=1.0
gateway.sensors[1].calibration-offset=-2.0

gateway.sensors[2].id=press-1
gateway.sensors[2].type=PRESSURE
gateway.sensors[2].period-ms=300
gateway.sensors[2].range-min=900
gateway.sensors[2].range-max=1100
gateway.sensors[2].timestamp-tolerance-ms=1000
gateway.sensors[2].calibration-gain=1.0
gateway.sensors[2].calibration-offset=0.0
