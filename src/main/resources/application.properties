# =============================================================
# 传感器采样网关配置
# 全部参数可本地调整，无需任何外部服务或凭据。
# =============================================================

spring.application.name=sensor-sampling-gateway

# 有界缓冲容量（条）：生产快于消费时最多暂存的原始读数数量
gateway.buffer-capacity=64

# 缓冲写满时的溢出策略：BLOCK（背压，不丢数）/ DROP_NEWEST（拒新）/ DROP_OLDEST（挤旧）
gateway.overflow-policy=BLOCK

# 瞬时故障有界重试与退避
gateway.retry.max-attempts=3
gateway.retry.initial-backoff=10ms
gateway.retry.max-backoff=200ms
gateway.retry.backoff-multiplier=2.0

# 连续失败多少个采样轮次后隔离该传感器；隔离后恢复探测周期
gateway.retry.failure-threshold=3
gateway.retry.probe-interval=1s

# 内嵌 Web 观测端口
server.port=8080
